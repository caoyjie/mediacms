AWSTemplateFormatVersion: '2010-09-09'
Description: MediaCMS private AWS media infrastructure

Metadata:
  cfn-lint:
    config:
      # W1030 cannot infer that the empty ACM ARN is used only in the
      # CloudFront default-certificate branch.
      ignore_checks: [W1030, W2001, W8001]

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, prod]
  ResourceNamePrefix:
    Type: String
    Default: mediacms
    AllowedValues: [mediacms, mediacms-dev]
  MediaBucketName:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
  ApplicationOrigin:
    Type: String
    AllowedPattern: '^(https://[A-Za-z0-9.-]+(?::[0-9]+)?|http://localhost(?::[0-9]+)?)$'
  RuntimeAccessKeyAEnabled:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
  RuntimeAccessKeyBEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  RuntimeActiveAccessKeySlot:
    Type: String
    Default: A
    AllowedValues: [A, B]
  CloudFrontPublicKeyCurrent:
    Type: String
    Description: Current CloudFront RSA public key in PEM format.
  CloudFrontPublicKeyNext:
    Type: String
    Description: Next CloudFront RSA public key in PEM format.
  EnableCustomDomain:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  MediaDomainName:
    Type: String
    Default: ''
  AcmCertificateArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws[a-zA-Z-]*:acm:us-east-1:[0-9]{12}:certificate/[0-9a-f-]+$'
  AlarmNotificationEmail:
    Type: String
    Default: ''
  AutomatedAbrEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  AccelerationMode:
    Type: String
    Default: DISABLED
    AllowedValues: [DISABLED, PREFERRED]

Rules:
  ResourceNamePrefixMatchesEnvironment:
    Assertions:
      - Assert: !Or
          - !And
            - !Equals [!Ref Environment, prod]
            - !Equals [!Ref ResourceNamePrefix, mediacms]
          - !And
            - !Equals [!Ref Environment, dev]
            - !Equals [!Ref ResourceNamePrefix, mediacms-dev]
        AssertDescription: ResourceNamePrefix must match the selected Environment.
  RuntimeAccessKeySlotsAreValid:
    Assertions:
      - Assert: !Or
          - !Equals [!Ref RuntimeAccessKeyAEnabled, 'true']
          - !Equals [!Ref RuntimeAccessKeyBEnabled, 'true']
        AssertDescription: At least one runtime access key slot must be enabled.
      - Assert: !Or
          - !And
            - !Equals [!Ref RuntimeActiveAccessKeySlot, A]
            - !Equals [!Ref RuntimeAccessKeyAEnabled, 'true']
          - !And
            - !Equals [!Ref RuntimeActiveAccessKeySlot, B]
            - !Equals [!Ref RuntimeAccessKeyBEnabled, 'true']
        AssertDescription: The active runtime access key slot must be enabled.
  MvpFeaturesRemainDisabled:
    Assertions:
      - Assert: !Equals [!Ref AutomatedAbrEnabled, 'false']
        AssertDescription: Automated ABR is disabled for the MVP.
      - Assert: !Equals [!Ref AccelerationMode, DISABLED]
        AssertDescription: Accelerated transcoding is disabled for the MVP.
  CustomDomainConfigurationIsComplete:
    Assertions:
      - Assert: !Or
          - !Equals [!Ref EnableCustomDomain, 'false']
          - !And
            - !Not [!Equals [!Ref MediaDomainName, '']]
            - !Not [!Equals [!Ref AcmCertificateArn, '']]
        AssertDescription: Custom domains require both a media domain and ACM certificate ARN.

Conditions:
  UseDefaultMediaBucketName: !Equals [!Ref MediaBucketName, '']
  UseCustomDomain: !Equals [!Ref EnableCustomDomain, 'true']
  CreateRuntimeAccessKeyA: !Equals [!Ref RuntimeAccessKeyAEnabled, 'true']
  CreateRuntimeAccessKeyB: !Equals [!Ref RuntimeAccessKeyBEnabled, 'true']
  UseRuntimeAccessKeyA: !Equals [!Ref RuntimeActiveAccessKeySlot, A]

Resources:
  MediaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !If
        - UseDefaultMediaBucketName
        - !Sub 'mediacms-${AWS::AccountId}-us-east-1'
        - !Ref MediaBucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [PUT, HEAD]
            AllowedOrigins: [!Ref ApplicationOrigin]
            ExposedHeaders:
              - ETag
              - x-amz-checksum-crc32
              - x-amz-checksum-crc32c
              - x-amz-checksum-sha1
              - x-amz-checksum-sha256
            MaxAge: 3600
      LifecycleConfiguration:
        Rules:
          - Id: AbortStaleMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Project
          Value: mediacms
        - Key: Environment
          Value: !Ref Environment

  MediaOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Description: !Sub '${ResourceNamePrefix} private S3 media origin'
        Name: !Sub '${ResourceNamePrefix}-media-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CloudFrontPublicKeyCurrentResource:
    Type: AWS::CloudFront::PublicKey
    Properties:
      PublicKeyConfig:
        CallerReference: !Sub '${AWS::StackName}-current'
        Comment: !Sub '${ResourceNamePrefix} current playback signing key'
        EncodedKey: !Ref CloudFrontPublicKeyCurrent
        Name: !Sub '${ResourceNamePrefix}-playback-current'

  CloudFrontPublicKeyNextResource:
    Type: AWS::CloudFront::PublicKey
    Properties:
      PublicKeyConfig:
        CallerReference: !Sub '${AWS::StackName}-next'
        Comment: !Sub '${ResourceNamePrefix} next playback signing key'
        EncodedKey: !Ref CloudFrontPublicKeyNext
        Name: !Sub '${ResourceNamePrefix}-playback-next'

  MediaKeyGroup:
    Type: AWS::CloudFront::KeyGroup
    Properties:
      KeyGroupConfig:
        Comment: !Sub '${ResourceNamePrefix} playback signing keys'
        Items:
          - !Ref CloudFrontPublicKeyCurrentResource
          - !Ref CloudFrontPublicKeyNextResource
        Name: !Sub '${ResourceNamePrefix}-playback'

  MediaCorsResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Comment: !Sub '${ResourceNamePrefix} credentialed media CORS'
        CorsConfig:
          AccessControlAllowCredentials: true
          AccessControlAllowHeaders:
            Items: ['*']
          AccessControlAllowMethods:
            Items: [GET, HEAD, OPTIONS]
          AccessControlAllowOrigins:
            Items: [!Ref ApplicationOrigin]
          AccessControlExposeHeaders:
            Items:
              - ETag
              - x-amz-checksum-crc32
              - x-amz-checksum-crc32c
              - x-amz-checksum-sha1
              - x-amz-checksum-sha256
          AccessControlMaxAgeSec: 3600
          OriginOverride: true
        Name: !Sub '${ResourceNamePrefix}-media-cors'

  MediaDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Aliases: !If
          - UseCustomDomain
          - [!Ref MediaDomainName]
          - !Ref AWS::NoValue
        Comment: !Sub '${ResourceNamePrefix} private media delivery'
        DefaultCacheBehavior:
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          ResponseHeadersPolicyId: !Ref MediaCorsResponseHeadersPolicy
          TargetOriginId: MediaS3Origin
          TrustedKeyGroups: [!Ref MediaKeyGroup]
          ViewerProtocolPolicy: redirect-to-https
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        Origins:
          - DomainName: !GetAtt MediaBucket.RegionalDomainName
            Id: MediaS3Origin
            OriginAccessControlId: !Ref MediaOAC
            S3OriginConfig:
              OriginAccessIdentity: ''
        PriceClass: PriceClass_100
        ViewerCertificate: !If
          - UseCustomDomain
          - AcmCertificateArn: !Ref AcmCertificateArn
            MinimumProtocolVersion: TLSv1.2_2021
            SslSupportMethod: sni-only
          - CloudFrontDefaultCertificate: true
      Tags:
        - Key: Project
          Value: mediacms
        - Key: Environment
          Value: !Ref Environment

  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${MediaBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${MediaDistribution}'

  MediaCMSRuntimeUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Sub 'mediacms-${Environment}-runtime'
      Tags:
        - Key: Project
          Value: mediacms
        - Key: Environment
          Value: !Ref Environment

  MediaConvertServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ResourceNamePrefix}-mediaconvert'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: mediaconvert.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: MediaBucketTranscoding
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ListTranscodingPrefixes
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt MediaBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix:
                      - originals/*
                      - candidates/*
              - Sid: ReadOriginals
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${MediaBucket.Arn}/originals/*'
              - Sid: WriteCandidates
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub '${MediaBucket.Arn}/candidates/*'
      Tags:
        - Key: Project
          Value: mediacms
        - Key: Environment
          Value: !Ref Environment

  MediaCMSRuntimePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub '${ResourceNamePrefix}-runtime'
      Users: [!Ref MediaCMSRuntimeUser]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: InspectMediaBucket
            Effect: Allow
            Action:
              - s3:GetBucketLocation
              - s3:ListBucketMultipartUploads
            Resource: !GetAtt MediaBucket.Arn
          - Sid: ListMediaPrefixes
            Effect: Allow
            Action: s3:ListBucket
            Resource: !GetAtt MediaBucket.Arn
            Condition:
              StringLike:
                s3:prefix:
                  - uploads/*
                  - originals/*
                  - candidates/*
                  - system/defaults/*
          - Sid: ManageMediaObjects
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
              - s3:AbortMultipartUpload
              - s3:ListMultipartUploadParts
            Resource:
              - !Sub '${MediaBucket.Arn}/uploads/*'
              - !Sub '${MediaBucket.Arn}/originals/*'
              - !Sub '${MediaBucket.Arn}/candidates/*'
              - !Sub '${MediaBucket.Arn}/system/defaults/*'
          - Sid: CreateTaggedMediaConvertJobs
            Effect: Allow
            Action: mediaconvert:CreateJob
            Resource: '*'
            Condition:
              StringEquals:
                aws:RequestTag/Project: mediacms
                aws:RequestTag/Environment: !Ref Environment
          - Sid: ManageMediaConvertJobs
            Effect: Allow
            Action:
              - mediaconvert:GetJob
              - mediaconvert:CancelJob
            Resource: !Sub 'arn:${AWS::Partition}:mediaconvert:${AWS::Region}:${AWS::AccountId}:jobs/*'
          - Sid: ReadMediaConvertTemplates
            Effect: Allow
            Action: mediaconvert:GetJobTemplate
            Resource: !Sub 'arn:${AWS::Partition}:mediaconvert:${AWS::Region}:${AWS::AccountId}:jobTemplates/${ResourceNamePrefix}-*'
          - Sid: DiscoverMediaConvertEndpoint
            Effect: Allow
            Action: mediaconvert:DescribeEndpoints
            Resource: '*'
          - Sid: PublishProcessingMetrics
            Effect: Allow
            Action: cloudwatch:PutMetricData
            Resource: '*'
            Condition:
              StringEquals:
                cloudwatch:namespace: MediaCMS/Processing
          - Sid: PassMediaConvertRole
            Effect: Allow
            Action: iam:PassRole
            Resource: !GetAtt MediaConvertServiceRole.Arn
            Condition:
              StringEquals:
                iam:PassedToService: mediaconvert.amazonaws.com

  RuntimeAccessKeyA:
    Type: AWS::IAM::AccessKey
    Condition: CreateRuntimeAccessKeyA
    Properties:
      Status: Active
      UserName: !Ref MediaCMSRuntimeUser

  RuntimeAccessKeyB:
    Type: AWS::IAM::AccessKey
    Condition: CreateRuntimeAccessKeyB
    Properties:
      Status: Active
      UserName: !Ref MediaCMSRuntimeUser

  RuntimeCredentialsSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub '${ResourceNamePrefix} runtime AWS credentials'
      Name: !Sub '${ResourceNamePrefix}/runtime/aws-credentials'
      SecretString: !Sub
        - '{"AWS_ACCESS_KEY_ID":"${AccessKeyId}","AWS_SECRET_ACCESS_KEY":"${SecretAccessKey}","AWS_REGION":"us-east-1","AWS_DEFAULT_REGION":"us-east-1"}'
        - AccessKeyId: !If
            - UseRuntimeAccessKeyA
            - !Ref RuntimeAccessKeyA
            - !Ref RuntimeAccessKeyB
          SecretAccessKey: !If
            - UseRuntimeAccessKeyA
            - !GetAtt RuntimeAccessKeyA.SecretAccessKey
            - !GetAtt RuntimeAccessKeyB.SecretAccessKey
      Tags:
        - Key: Project
          Value: mediacms
        - Key: Environment
          Value: !Ref Environment

  VideoHlsJobTemplate:
    Type: AWS::MediaConvert::JobTemplate
    Properties:
      AccelerationSettings:
        Mode: DISABLED
      Category: mediacms
      Description: Fixed QVBR HLS ladder; the coordinator removes renditions above source resolution before CreateJob.
      Name: !Sub '${ResourceNamePrefix}-video-hls-v1'
      Priority: 0
      SettingsJson: |
        {
          "Inputs": [
            {
              "AudioSelectors": {
                "Default Audio": {"DefaultSelection": "DEFAULT"}
              },
              "VideoSelector": {"Rotate": "AUTO"}
            }
          ],
          "OutputGroups": [
            {
              "Name": "Apple HLS",
              "OutputGroupSettings": {
                "Type": "HLS_GROUP_SETTINGS",
                "HlsGroupSettings": {
                  "MinSegmentLength": 0,
                  "SegmentLength": 4
                }
              },
              "Outputs": [
                {
                  "NameModifier": "_1080p",
                  "ContainerSettings": {"Container": "M3U8", "M3u8Settings": {}},
                  "VideoDescription": {
                    "Width": 1920,
                    "Height": 1080,
                    "CodecSettings": {
                      "Codec": "H_264",
                      "H264Settings": {
                        "FramerateControl": "INITIALIZE_FROM_SOURCE",
                        "GopSize": 2.0,
                        "GopSizeUnits": "SECONDS",
                        "ParControl": "INITIALIZE_FROM_SOURCE",
                        "QualityTuningLevel": "SINGLE_PASS_HQ",
                        "RateControlMode": "QVBR",
                        "MaxBitrate": 6000000,
                        "QvbrSettings": {"QvbrQualityLevel": 8}
                      }
                    }
                  },
                  "AudioDescriptions": [
                    {
                      "AudioSourceName": "Default Audio",
                      "CodecSettings": {
                        "Codec": "AAC",
                        "AacSettings": {
                          "Bitrate": 128000,
                          "CodingMode": "CODING_MODE_2_0",
                          "CodecProfile": "LC",
                          "SampleRate": 48000,
                          "Specification": "MPEG4"
                        }
                      }
                    }
                  ]
                },
                {
                  "NameModifier": "_720p",
                  "ContainerSettings": {"Container": "M3U8", "M3u8Settings": {}},
                  "VideoDescription": {
                    "Width": 1280,
                    "Height": 720,
                    "CodecSettings": {
                      "Codec": "H_264",
                      "H264Settings": {
                        "FramerateControl": "INITIALIZE_FROM_SOURCE",
                        "GopSize": 2.0,
                        "GopSizeUnits": "SECONDS",
                        "ParControl": "INITIALIZE_FROM_SOURCE",
                        "QualityTuningLevel": "SINGLE_PASS_HQ",
                        "RateControlMode": "QVBR",
                        "MaxBitrate": 4000000,
                        "QvbrSettings": {"QvbrQualityLevel": 8}
                      }
                    }
                  },
                  "AudioDescriptions": [
                    {
                      "AudioSourceName": "Default Audio",
                      "CodecSettings": {
                        "Codec": "AAC",
                        "AacSettings": {
                          "Bitrate": 128000,
                          "CodingMode": "CODING_MODE_2_0",
                          "CodecProfile": "LC",
                          "SampleRate": 48000,
                          "Specification": "MPEG4"
                        }
                      }
                    }
                  ]
                },
                {
                  "NameModifier": "_480p",
                  "ContainerSettings": {"Container": "M3U8", "M3u8Settings": {}},
                  "VideoDescription": {
                    "Width": 854,
                    "Height": 480,
                    "CodecSettings": {
                      "Codec": "H_264",
                      "H264Settings": {
                        "FramerateControl": "INITIALIZE_FROM_SOURCE",
                        "GopSize": 2.0,
                        "GopSizeUnits": "SECONDS",
                        "ParControl": "INITIALIZE_FROM_SOURCE",
                        "QualityTuningLevel": "SINGLE_PASS_HQ",
                        "RateControlMode": "QVBR",
                        "MaxBitrate": 1000000,
                        "QvbrSettings": {"QvbrQualityLevel": 7}
                      }
                    }
                  },
                  "AudioDescriptions": [
                    {
                      "AudioSourceName": "Default Audio",
                      "CodecSettings": {
                        "Codec": "AAC",
                        "AacSettings": {
                          "Bitrate": 128000,
                          "CodingMode": "CODING_MODE_2_0",
                          "CodecProfile": "LC",
                          "SampleRate": 48000,
                          "Specification": "MPEG4"
                        }
                      }
                    }
                  ]
                },
                {
                  "NameModifier": "_360p",
                  "ContainerSettings": {"Container": "M3U8", "M3u8Settings": {}},
                  "VideoDescription": {
                    "Width": 640,
                    "Height": 360,
                    "CodecSettings": {
                      "Codec": "H_264",
                      "H264Settings": {
                        "FramerateControl": "INITIALIZE_FROM_SOURCE",
                        "GopSize": 2.0,
                        "GopSizeUnits": "SECONDS",
                        "ParControl": "INITIALIZE_FROM_SOURCE",
                        "QualityTuningLevel": "SINGLE_PASS_HQ",
                        "RateControlMode": "QVBR",
                        "MaxBitrate": 700000,
                        "QvbrSettings": {"QvbrQualityLevel": 7}
                      }
                    }
                  },
                  "AudioDescriptions": [
                    {
                      "AudioSourceName": "Default Audio",
                      "CodecSettings": {
                        "Codec": "AAC",
                        "AacSettings": {
                          "Bitrate": 128000,
                          "CodingMode": "CODING_MODE_2_0",
                          "CodecProfile": "LC",
                          "SampleRate": 48000,
                          "Specification": "MPEG4"
                        }
                      }
                    }
                  ]
                }
              ]
            },
            {
              "Name": "First valid video frame",
              "OutputGroupSettings": {
                "Type": "FILE_GROUP_SETTINGS",
                "FileGroupSettings": {}
              },
              "Outputs": [
                {
                  "NameModifier": "_poster",
                  "ContainerSettings": {"Container": "RAW"},
                  "VideoDescription": {
                    "Width": 1280,
                    "Height": 720,
                    "CodecSettings": {
                      "Codec": "FRAME_CAPTURE",
                      "FrameCaptureSettings": {
                        "FramerateNumerator": 1,
                        "FramerateDenominator": 1,
                        "MaxCaptures": 1,
                        "Quality": 80
                      }
                    }
                  }
                }
              ]
            }
          ]
        }
      StatusUpdateInterval: SECONDS_10
      Tags:
        Project: mediacms
        Environment: !Ref Environment

  AudioHlsJobTemplate:
    Type: AWS::MediaConvert::JobTemplate
    Properties:
      AccelerationSettings:
        Mode: DISABLED
      Category: mediacms
      Description: Audio-only Apple HLS template.
      Name: !Sub '${ResourceNamePrefix}-audio-hls-v1'
      Priority: 0
      SettingsJson: |
        {
          "Inputs": [
            {
              "AudioSelectors": {
                "Default Audio": {"DefaultSelection": "DEFAULT"}
              }
            }
          ],
          "OutputGroups": [
            {
              "Name": "Apple HLS Audio",
              "OutputGroupSettings": {
                "Type": "HLS_GROUP_SETTINGS",
                "HlsGroupSettings": {
                  "MinSegmentLength": 0,
                  "SegmentLength": 4
                }
              },
              "Outputs": [
                {
                  "NameModifier": "_audio",
                  "ContainerSettings": {"Container": "M3U8", "M3u8Settings": {}},
                  "AudioDescriptions": [
                    {
                      "AudioSourceName": "Default Audio",
                      "CodecSettings": {
                        "Codec": "AAC",
                        "AacSettings": {
                          "Bitrate": 128000,
                          "CodingMode": "CODING_MODE_2_0",
                          "CodecProfile": "LC",
                          "SampleRate": 48000,
                          "Specification": "MPEG4"
                        }
                      }
                    }
                  ]
                }
              ]
            }
          ]
        }
      StatusUpdateInterval: SECONDS_10
      Tags:
        Project: mediacms
        Environment: !Ref Environment

Outputs:
  MediaBucketName:
    Value: !Ref MediaBucket
  MediaBucketArn:
    Value: !GetAtt MediaBucket.Arn
  MediaConvertServiceRoleArn:
    Value: !GetAtt MediaConvertServiceRole.Arn
  VideoHlsJobTemplateName:
    Value: !Ref VideoHlsJobTemplate
  AudioHlsJobTemplateName:
    Value: !Ref AudioHlsJobTemplate
  MediaDistributionId:
    Value: !Ref MediaDistribution
  MediaDistributionDomainName:
    Value: !GetAtt MediaDistribution.DomainName
  MediaKeyGroupId:
    Value: !Ref MediaKeyGroup
  CloudFrontPublicKeyCurrentId:
    Value: !Ref CloudFrontPublicKeyCurrentResource
  CloudFrontPublicKeyNextId:
    Value: !Ref CloudFrontPublicKeyNextResource
  RuntimeUserName:
    Value: !Ref MediaCMSRuntimeUser
  RuntimeCredentialsSecretArn:
    Value: !Ref RuntimeCredentialsSecret
